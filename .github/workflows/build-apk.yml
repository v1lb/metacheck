name: Build installable APK

# Ручной запуск: Actions -> "Build installable APK" -> Run workflow.
# Результат: артефакт MetaCheck-installable-apk с app-release.apk (подписан debug-ключом, ставится на телефон).
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        run: gradle --no-daemon assembleRelease -x lintVitalRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaCheck-installable-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
