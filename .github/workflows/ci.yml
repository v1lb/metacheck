name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      # Подписанный релиз собирается вручную (см. DEPLOY.md), в CI проверяем тесты, линт и debug-сборку.
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests, lint and build APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload unit-test reports when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metacheck-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MetaCheck-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

