# Единое место версий (аудит, п. 13). Обновлять здесь, а не в build.gradle.kts.
# Линия AGP 8.x (последняя 8.13) выбрана сознательно: переход на AGP 9 меняет подключение Kotlin
# (встроенный Kotlin) и ряд значений по умолчанию, это отдельный шаг с полной проверкой сборки.
[versions]
agp = "8.13.0"
kotlin = "2.2.20"
coroutines = "1.10.2"
composeBom = "2025.08.00"
coreKtx = "1.17.0"
lifecycle = "2.9.2"
activity = "1.10.1"
appcompat = "1.7.1"
exifinterface = "1.4.1"
datastore = "1.1.7"
billing = "8.0.0"
okhttp = "4.12.0"
osmdroid = "6.1.20"
junit = "4.13.2"
androidxJunit = "1.3.0"
orgJson = "20250517"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
# Только для языка приложения (AppCompatDelegate.setApplicationLocales) на Android 8–12.
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# material3 1.4+ больше не тянет иконки транзитивно: подключаем явно (Icons.Filled.*, AutoMirrored).
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
# Полный набор иконок Material (камера, буфер, щит и т. д.). В release R8 оставляет только используемые.
play-review = { module = "com.google.android.play:review", version = "2.0.1" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
