name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      # Сборка через ./gradlew (версия Gradle и её SHA-256 — в gradle/wrapper/gradle-wrapper.properties).
      # setup-gradle v4 сам проверяет gradle-wrapper.jar по списку официальных контрольных сумм.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Подписанный релиз собирается вручную (см. DEPLOY.md), в CI проверяем тесты, линт и debug-сборку.
      - name: Install Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify text contrast
        run: python3 tools/check_contrast.py
      - name: Verify string resources match tools/i18n
        run: python3 tools/i18n/gen.py --check
      - name: Check Play release preflight
        run: python3 tools/release_gate.py
      - name: Run unit tests, lint, compile instrumentation tests and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Check permissions of the built APK
        run: python3 tools/check_apk_permissions.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unit-test reports when available
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metacheck-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MetaCheck-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

