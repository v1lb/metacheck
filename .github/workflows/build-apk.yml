name: Build installable APK

# Ручной запуск: Actions -> "Build installable APK" -> Run workflow.
# Результат: артефакт MetaCheck-installable-apk с app-release.apk (подписан debug-ключом, ставится на телефон).
# Это та же release-сборка (R8, без отладки), что уйдёт в Play, поэтому проверки те же: тесты и lint.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests and release lint
        run: gradle --no-daemon testReleaseUnitTest lintRelease
      # lintVitalRelease выполняется внутри assembleRelease, больше не пропускаем его через -x.
      - name: Build release APK
        env:
          METACHECK_MAPTILER_KEY: ${{ secrets.METACHECK_MAPTILER_KEY }}
        run: gradle --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaCheck-installable-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MetaCheck-apk-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
